server:
  port: 8080

spring:
  application:
    name: video-insight

  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB
      file-size-threshold: 2MB

  datasource:
    # 默认连本机 MySQL；密码走环境变量，不写进仓库
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/video_insight?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10      # 单机够用；调大只会把 MySQL 连接数顶满
      minimum-idle: 2
      connection-timeout: 3000

  jpa:
    # 关键：不用 update。表结构由 schema.sql 显式声明，启动时只做校验。
    # update 会"猜"你的意图（改字段类型可能悄悄丢数据），生产事故常见来源。
    hibernate:
      ddl-auto: validate
    open-in-view: false          # 避免 session 泄漏到视图层（默认 true 是历史包袱）
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
    show-sql: false

  sql:
    init:
      mode: always               # dev：每次启动执行 schema.sql（都是 CREATE IF NOT EXISTS）
      continue-on-error: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always       # 本机调试方便；生产建议 never

logging:
  level:
    root: INFO
    com.zhaozhenbo.video: DEBUG

video:
  tools:
    ffmpeg: ${FFMPEG_PATH:ffmpeg}
    ffprobe: ${FFPROBE_PATH:ffprobe}
    ytdlp: ${YTDLP_PATH:yt-dlp}
    cookies-file: ${YTDLP_COOKIES_FILE:}
  asr:
    enabled: ${ASR_ENABLED:false}
    base-url: ${ASR_BASE_URL:https://api.openai.com}
    api-key: ${ASR_API_KEY:}
    model: ${ASR_MODEL:whisper-1}
    language: ${ASR_LANGUAGE:zh}
    timeout-seconds: 300
    max-audio-mb: 100
  rate-limit:
    # memory 便于本地/测试；多实例生产切 redis
    mode: ${RATE_LIMIT_MODE:memory}
    capacity: ${RATE_LIMIT_CAPACITY:10}
    refill-per-second: ${RATE_LIMIT_REFILL:2}
  pipeline:
    # 真实阶段处理器；测试 profile 关闭，改用 fake handlers
    real-handlers: true
  llm:
    # fake 用于本地演示；线上用 http（DeepSeek/Qwen/GLM 的 OpenAI 兼容端点）
    provider: ${LLM_PROVIDER:http}
    base-url: ${LLM_BASE_URL:https://api.deepseek.com}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:deepseek-chat}
    timeout-seconds: 60
  mq:
    # 本地默认关闭，避免没启动 broker 时应用起不来；生产设 MQ_ENABLED=true
    enabled: ${MQ_ENABLED:false}
    namesrv-addr: ${MQ_NAMESRV:127.0.0.1:9876}
    topic: video-task
    dlq-topic: "%DLQ%video-task"
    producer-group: video-task-producer
    consumer-group: video-task
    compensation-interval-ms: 30000
    pending-grace-seconds: 60
